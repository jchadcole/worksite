<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.web3forms.com; form-action https://api.web3forms.com; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Your Business Name</title>
  <meta name="description" content="Get in touch with Your Business Name.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1 id="biz-name">Your Business Name</h1>
      <p class="tagline">A one-line description of what you do.</p>
    </header>

    <form id="contact" action="https://api.web3forms.com/submit" method="POST" novalidate>
      <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
      <input type="hidden" name="subject" value="New inquiry from your website">
      <input type="hidden" name="from_name" value="Website contact form">
      <!-- Honeypot: hidden from people, bots fill it in and get dropped -->
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

      <label for="name">Name</label>
      <input id="name" name="name" type="text" required maxlength="100" autocomplete="name">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="200" autocomplete="email">

      <label for="message">How can we help?</label>
      <textarea id="message" name="message" required rows="6" maxlength="5000"></textarea>

      <button type="submit">Send inquiry</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <footer>&copy; <span id="year"></span> <span class="biz">Your Business Name</span></footer>
  <script src="script.js"></script>
</body>
</html>
